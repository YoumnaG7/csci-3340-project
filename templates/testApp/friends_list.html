<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Friends | SHARETIME</title>
</head>
<body>

    <h1>My Friends</h1>

    {% if friends %}
        <ul>
            {% for friend in friends %}
                <li>{{ friend.username }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You don't have any friends yet.</p>
    {% endif %}

</body>
</html>
