
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARETIME | Log In</title>

    <style>
        :root {
            --green-900: #1f4a38;
            --green-700: #2f6b50;
            --green-100: #e3ecdc;
            --bg: #f6f7f3;
            --surface: #ffffff;
            --line: #e6e8e2;
            --text: #1d2b25;
            --muted: #66716a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            height: 68px;
            background: white;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            padding: 0 max(24px, calc((100% - 1120px) / 2));
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--green-900);
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: var(--green-900);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 700;
        }

        main {
            min-height: calc(100vh - 68px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 18px 45px -25px rgba(31, 74, 56, .3);
        }

        .eyebrow {
            color: var(--green-700);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        h1 {
            color: var(--green-900);
            font-size: 2rem;
            margin: 10px 0;
        }

        .description {
            color: var(--muted);
            margin-bottom: 28px;
        }

        .error {
            background: #fff0ef;
            color: #a83232;
            border: 1px solid #f1cccc;
            padding: 12px;
            border-radius: 10px;
            font-size: .9rem;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: .9rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 1rem;
            background: #fff;
        }

        input:focus {
            outline: 2px solid var(--green-700);
            border-color: var(--green-700);
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--green-900);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-button:hover {
            background: var(--green-700);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--green-700);
            text-decoration: none;
            font-size: .9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="/" class="brand">
        <span class="brand-mark">S</span>
        sharetime
    </a>
</header>

<main>
    <div class="login-card">

        <span class="eyebrow">Your campus, in sync</span>

        <h1>Welcome back!</h1>

        <p class="description">
            Log in to connect with your friends and schedules.
        </p>

        {% if form.errors %}
            <div class="error">
                Your username or password is incorrect. Please try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="id_password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="login-button">
                Log In
            </button>
        </form>

        <a href="/" class="back-link">
            ← Back to homepage
        </a>

    </div>
</main>

</body>
</html>
